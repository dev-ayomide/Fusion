<!doctype html><html><head><meta charset="utf-8"><style>
@import url('/node_modules/@fontsource-variable/inter/index.css');
*{box-sizing:border-box;margin:0}body{width:390px;height:844px;background:#080c1c;color:#f4f6ff;font-family:"Inter Variable",system-ui;overflow:hidden;position:relative}
.glow{position:absolute;right:-120px;top:-140px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,#2b47c966,transparent 65%)}
.top{padding:64px 24px 0;position:relative}.hi{color:#8f9bc4;font-size:15px}.name{font-size:28px;font-weight:750;letter-spacing:-.02em;margin-top:4px}
.days{display:flex;gap:8px;margin:22px 24px 0}.d{flex:1;height:62px;border-radius:16px;background:#111733;display:grid;place-items:center;font-size:12px;color:#8f9bc4}.d b{display:block;font-size:17px;color:#f4f6ff}.d.on{background:#6ea8ff;color:#0a1030}.d.on b{color:#0a1030}
.ringcard{margin:20px 24px 0;border-radius:24px;background:#111733;padding:20px;display:flex;align-items:center;gap:18px}
.ring{width:96px;height:96px;border-radius:50%;background:conic-gradient(#c6ff4a 0 71%,#1f2750 71% 100%);display:grid;place-items:center}.ring i{width:74px;height:74px;border-radius:50%;background:#111733;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:22px}
.rc b{font-size:18px}.rc p{color:#8f9bc4;font-size:13px;margin-top:4px}
.h{margin:22px 24px 10px;font-size:13px;color:#8f9bc4;text-transform:uppercase;letter-spacing:.08em}
.habit{margin:0 24px 10px;border-radius:18px;background:#111733;padding:14px 16px;display:flex;align-items:center;gap:14px}
.ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px}
.habit .t{flex:1}.habit .t b{font-size:15px}.habit .t p{font-size:12px;color:#8f9bc4;margin-top:2px}
.ck{width:28px;height:28px;border-radius:50%;border:2px solid #2b3566;display:grid;place-items:center}.ck.on{background:#c6ff4a;border-color:#c6ff4a}.ck.on:after{content:"";width:10px;height:6px;border-left:3px solid #0a1030;border-bottom:3px solid #0a1030;transform:rotate(-45deg) translate(1px,-1px)}
.tab{position:absolute;left:0;right:0;bottom:0;height:84px;background:#0c1128;display:flex;justify-content:space-around;align-items:center;padding-bottom:18px}.tab span{width:26px;height:26px;border-radius:8px;background:#232b55}.tab span.on{background:#6ea8ff}
</style></head><body><div class="glow"></div>
<div class="top"><div class="hi">Thursday, 24 September</div><div class="name">Good morning, Sam</div></div>
<div class="days"><div class="d">M<b>21</b></div><div class="d">T<b>22</b></div><div class="d">W<b>23</b></div><div class="d on">T<b>24</b></div><div class="d">F<b>25</b></div><div class="d">S<b>26</b></div></div>
<div class="ringcard"><div class="ring"><i>5/7</i></div><div class="rc"><b>Almost there</b><p>2 habits left today · 12-day streak</p></div></div>
<div class="h">Today</div>
<div class="habit"><div class="ic" style="background:#26316b">🧘</div><div class="t"><b>Meditate</b><p>10 min · morning</p></div><div class="ck on"></div></div>
<div class="habit"><div class="ic" style="background:#3a2a55">📚</div><div class="t"><b>Read 20 pages</b><p>Atomic Habits</p></div><div class="ck on"></div></div>
<div class="habit"><div class="ic" style="background:#16433f">💧</div><div class="t"><b>Drink water</b><p>6 of 8 glasses</p></div><div class="ck on"></div></div>
<div class="habit"><div class="ic" style="background:#4a2a26">🏃</div><div class="t"><b>Run 5k</b><p>Evening</p></div><div class="ck"></div></div>
<div class="tab"><span class="on"></span><span></span><span></span><span></span></div>
</body></html>
